<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <script src="https://static.facilio.com/apps-sdk/beta/facilio_apps_sdk.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #7c3aed;
      --accent-dark: #6d28d9;
      --accent-soft: #ede9fe;
      --text: #1f2937;
      --muted: #6b7280;
      --surface: #ffffff;
      --bg: #f6f7f9;
      --border: #ececf1;
      --sk-bg: #e8eaee;
      --radius: 0.45rem;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent-soft: #2a2140;
        --text: #f3f4f6;
        --muted: #9ca3af;
        --surface: #1c2028;
        --bg: #12151b;
        --border: #2a2f3a;
        --sk-bg: #232733;
      }
    }
    html.dark {
      --accent-soft: #2a2140;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --surface: #1c2028;
      --bg: #12151b;
      --border: #2a2f3a;
      --sk-bg: #232733;
    }
    html.light {
      --accent-soft: #ede9fe;
      --text: #1f2937;
      --muted: #6b7280;
      --surface: #ffffff;
      --bg: #f6f7f9;
      --border: #ececf1;
      --sk-bg: #e8eaee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      min-height: 100%;
    }
    .page { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .brand {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
    }
    .brand img { height: 44px; width: auto; max-width: 80%; object-fit: contain; }
    .banner {
      background: linear-gradient(120deg, #1d4ed8 0%, #2563eb 60%, #3b82f6 100%);
      border-radius: 12px;
      padding: 20px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    .avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: #fff;
      color: #1d4ed8;
      font-size: 20px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .banner-text { min-width: 0; }
    .hello { font-size: 13px; opacity: 0.9; }
    .who {
      font-size: 19px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mail {
      font-size: 12px; opacity: 0.85;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .action-card {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      text-align: left;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.08s ease, box-shadow 0.12s ease;
    }
    .action-card:active { transform: scale(0.985); box-shadow: 0 1px 2px rgba(16,24,40,0.08); }
    .action-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      position: relative;
    }
    .action-icon svg { width: 34px; height: 34px; stroke: var(--accent); }
    .action-title {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
    }
    .action-cta {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      pointer-events: none;
    }
    .action-cta svg { width: 18px; height: 18px; stroke: #fff; }
    .badge {
      position: absolute;
      top: -8px; right: -8px;
      min-width: 24px; height: 24px;
      padding: 0 6px;
      border-radius: 12px;
      background: #1d4ed8;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid var(--surface);
    }
    .chev { flex-shrink: 0; transition: transform 0.15s ease; }
    .chev.open { transform: rotate(90deg); }
    .chev svg { width: 22px; height: 22px; stroke: var(--muted); }
    .task-list {
      display: flex; flex-direction: column; gap: 8px;
      margin-top: -6px;
    }
    .task-item {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      cursor: pointer; font: inherit; color: var(--text); text-align: left;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.05);
      -webkit-tap-highlight-color: transparent;
    }
    .task-item:active { transform: scale(0.99); }
    .task-name { font-size: 14px; font-weight: 500; line-height: 1.35; }
    .task-id { font-size: 12px; color: var(--muted); flex-shrink: 0; }
    .subtle { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
    .sk { border-radius: 12px; background: var(--sk-bg); position: relative; overflow: hidden; }
    .sk::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
      animation: shimmer 1.3s infinite;
    }
    @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
    .sk-banner { height: 96px; }
    .sk-btn { height: 108px; border-radius: 16px; }
  </style>
</head>

        <div class="sk sk-btn"></div>

  <script>
    // ================= MAINTENANCE APP BUILD =================
    // Module linkName holding the risk-assessment inspections.
    var INSPECTION_MODULE = 'inspectionResponse';
    // View opened when the user taps "My Pending Tasks" (same saved view
    // used by the occupant-portal build, where this button works). This is
    // a saved VIEW LINK NAME (a stable config identifier your org defines,
    // not a per-record catalog id), so it's already portable across
    // sandbox/production as-is -- no change needed here.
    var PENDING_VIEW = 'approvalpendingriskassessment';
    // Module linkName for work orders, opened by "View Work Orders". Module
    // API names are schema-level and shared across environments -- also
    // already portable as-is.
    var WORKORDER_MODULE = 'workorder';

    // -----------------------------------------------------------------------
    // FIX: dynamic Service Catalog navigation (was hardcoded to production)
    //
    // The old navigateTab() called:
    //   window.facilioApp.interface.trigger('navigateTab', { id: 19741, type: "SERVICE_CATALOG" })
    //
    // `id: 19741` is NOT business data -- it's the internal id of a
    // Setup > Tabs & Layouts entry (the "Work Order Request" tab group,
    // under the MOBILE layout, backing a SERVICE_CATALOG-type web tab).
    // Tab/layout config lives in each environment's own Setup, so sandbox
    // and production each have their OWN copy with their OWN numeric id.
    //
    // Both ids are now confirmed directly (you pulled the sandbox app
    // layout and it was matched against production's known value):
    //   PRODUCTION: 19741
    //   SANDBOX:    19005  -- "Work Order Request" tab group, mobile
    //               layout, route "service-catalogue", webTab typeEnum
    //               SERVICE_CATALOG -- same shape as production's entry,
    //               confirmed from the sandbox app-layout API response.
    //
    // An earlier version of this fix read the id from a Connected App
    // Variable (a one-time admin setup step). This version is simpler and
    // needs no admin action: it detects which environment the widget is
    // running in at runtime, via getCurrentOrg().domain, and picks the
    // matching hardcoded id directly. For this org, the sandbox domain is
    // "dunnesstores.faciliosandbox.co.uk/dunnesstoressandbox" (contains
    // "sandbox") vs a plain production domain -- so a simple substring
    // check reliably tells the two apart.
    //
    // !! VERIFY IN SANDBOX !! -- tap "Raise Work Order Request" once in
    // sandbox and confirm it opens the right tab; check Connected App
    // Logs for the "Service Catalog tab id resolved" line to see which
    // domain/branch fired. If Facilio ever re-saves or rebuilds either
    // environment's tab (which can change its id), these two hardcoded
    // values will need updating to match.
    // -----------------------------------------------------------------------
    var SERVICE_CATALOG_TAB_ID = {
      production: 19741,
      sandbox: 53147
    };

    function resolveServiceCatalogTabId(org) {
      var domain = (org && (org.domain || org.orgDomain)) || '';
      var isSandbox = domain.toLowerCase().indexOf('sandbox') !== -1;
      var tabId = isSandbox ? SERVICE_CATALOG_TAB_ID.sandbox : SERVICE_CATALOG_TAB_ID.production;
      window.facilioApp.log.info(
        'Service Catalog tab id resolved: domain="' + domain + '" -> ' +
        (isSandbox ? 'SANDBOX' : 'PRODUCTION') + ' -> id=' + tabId
      );
      return tabId;
    }
    // =========================================================
    new Vue({
      el: '#app',
      data: {
        loading: true,
        user: {},
        org: {}
      },
      computed: {
        displayName() {
          return (this.user && this.user.name) || (this.org && this.org.name) || 'Welcome';
        },
        email() {
          return (this.user && (this.user.email || this.user.userName)) || '';
        },
        avatarUrl() {
          return (this.user && this.user.avatarUrl) || '';
        },
        initials() {
          var n = this.displayName || '';
          var parts = n.trim().split(/\s+/);
          var ini = parts.slice(0, 2).map(function (p) { return p.charAt(0); }).join('');
          return (ini || 'U').toUpperCase();
        }
      },
      created() {
        window.facilioApp = FacilioAppSDK.init();
        window.facilioApp.on('app.loaded', () => {
          try {
            this.user = window.facilioApp.getCurrentUser() || {};
            this.org = window.facilioApp.getCurrentOrg() || {};
            window.facilioApp.log.info(
              'Home widget loaded | user=' + (this.user.id || 'n/a') +
              ' | org=' + (this.org.id || 'n/a')
            );
            this.applyTheme();
          } catch (error) {
            window.facilioApp.log.error('Home widget: context read failed', error);
          } finally {
            this.loading = false;
            window.takePrintNow = true;
          }
        });
        window.facilioApp.on('app.destroyed', function () { /* no-op */ });
      },
      methods: {
        applyTheme() {
          try {
            var candidates = {
              orgTheme: this.org && this.org.theme,
              orgColorScheme: this.org && this.org.colorScheme,
              orgDarkMode: this.org && this.org.darkMode,
              userTheme: this.user && this.user.theme,
              userColorScheme: this.user && this.user.colorScheme,
              userDarkMode: this.user && this.user.darkMode
            };
            window.facilioApp.log.info('Theme candidates: ' + JSON.stringify(candidates));
            var mode = null;
            if (candidates.orgTheme) mode = candidates.orgTheme;
            else if (candidates.userTheme) mode = candidates.userTheme;
            else if (candidates.orgColorScheme) mode = candidates.orgColorScheme;
            else if (candidates.userColorScheme) mode = candidates.userColorScheme;
            else if (candidates.orgDarkMode !== undefined) mode = candidates.orgDarkMode ? 'dark' : 'light';
            else if (candidates.userDarkMode !== undefined) mode = candidates.userDarkMode ? 'dark' : 'light';
            var root = document.documentElement;
            root.classList.remove('dark', 'light');
            if (typeof mode === 'string') {
              mode = mode.toLowerCase();
              if (mode === 'dark' || mode === 'light') {
                root.classList.add(mode);
              }
            }
          } catch (error) {
            window.facilioApp.log.error('Theme sync failed', error);
          }
        },
        openPendingTasks() {
          try {
            var payload = {
              module: INSPECTION_MODULE,
              view: PENDING_VIEW
            };
            window.facilioApp.log.info('Pending tasks tapped | openListView ' + JSON.stringify(payload));
            window.facilioApp.interface.openListView(payload);
          } catch (error) {
            window.facilioApp.log.error('Pending tasks: openListView failed', error);
            try {
              window.facilioApp.interface.notify({
                title: 'Navigation failed',
                message: 'Could not open pending tasks. Please try again.',
                type: 'error'
              });
            } catch (e) { /* best-effort */ }
          }
        },
        openWorkOrders() {
          try {
            var payload = { module: WORKORDER_MODULE };
            window.facilioApp.log.info('View Work Orders tapped | openListView ' + JSON.stringify(payload));
            window.facilioApp.interface.openListView(payload);
          } catch (error) {
            window.facilioApp.log.error('View Work Orders: openListView failed', error);
            try {
              window.facilioApp.interface.notify({
                title: 'Navigation failed',
                message: 'Could not open Work Orders. Please try again.',
                type: 'error'
              });
            } catch (e) { /* best-effort */ }
          }
        },
        navigateTab() {
          var tabId = resolveServiceCatalogTabId(this.org);
          var payload = { id: tabId, type: 'SERVICE_CATALOG' };
          window.facilioApp.log.info('Raise Work Order Request tapped | navigateTab ' + JSON.stringify(payload));
          window.facilioApp.interface.trigger('navigateTab', payload);
        }
      }
    });
  </script>
</body>
</html>
