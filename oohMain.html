<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vendor Out-of-Hours Info</title>
  <script src="https://static.facilio.com/apps-sdk/beta/facilio_apps_sdk.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
  <style>
    :root { --fac-primary: #3f2e9e; --fac-border: #e3e4ea; --fac-label: #6b7280; --fac-bg: #fafafb; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Roboto', 'Segoe UI', Arial, Helvetica, sans-serif; font-size: 13px; color: #1f2430; background: transparent; }
    .wrap { padding: 16px; }
    .skeleton { padding: 16px; }
    .skeleton .line { height: 12px; background: #eee; border-radius: 4px; margin-bottom: 10px; }
    .skeleton .line.w60 { width: 60%; }
    .skeleton .line.w40 { width: 40%; }

    .card { border: 1px solid var(--fac-border); border-radius: 10px; overflow: hidden; }
    .card-head { padding: 12px 16px; background: var(--fac-bg); border-bottom: 1px solid var(--fac-border); display: flex; align-items: center; justify-content: space-between; }
    .card-head h2 { font-size: 14px; font-weight: 600; }
    .card-body { padding: 16px; }

    .field-block { margin-bottom: 16px; }
    .field-block:last-child { margin-bottom: 0; }
    .field-label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fac-label); margin-bottom: 6px; }
    .field-value { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
    .field-value.empty { color: #9aa0ac; font-style: italic; }

    .empty-state, .error-state { padding: 24px 16px; text-align: center; color: var(--fac-label); }
    .error-state { color: #b00020; }

    .debug-box { margin-top: 16px; border: 1px dashed var(--fac-border); border-radius: 8px; padding: 10px 12px; font-family: monospace; font-size: 11px; color: var(--fac-label); white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
    .debug-toggle { font-size: 11px; color: var(--fac-primary); cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }
  </style>
</head>
<body>
  <div id="app">
    <div v-if="loading" class="skeleton">
      <div class="line w60"></div>
      <div class="line w40"></div>
      <div class="line w60"></div>
    </div>

    <div v-else class="wrap">
      <div v-if="fatalError" class="error-state">
        {{ fatalError }}
      </div>

      <div v-else-if="!vendorId" class="empty-state">
        No vendor is assigned to this work order.
      </div>

      <div v-else class="card">
        <div class="card-head">
          <h2>{{ vendor ? vendor.name : 'Vendor' }} — Out of Hours</h2>
        </div>
        <div class="card-body">
          <div class="field-block">
            <div class="field-label">Out of Hours Contact</div>
            <div class="field-value" :class="{ empty: !oohContact }">{{ oohContact || 'Not set' }}</div>
          </div>
          <div class="field-block">
            <div class="field-label">Out of Hours Notes</div>
            <div class="field-value" :class="{ empty: !oohNotes }">{{ oohNotes || 'Not set' }}</div>
          </div>
        </div>
      </div>

      <!-- Diagnostic: only relevant while confirming how this Web Tab receives
           the current Work Order's id via getContext(). Safe to remove once
           CONFIG.recordIdKeys below is confirmed against a real load. -->
      <span class="debug-toggle" @click="showDebug = !showDebug">{{ showDebug ? 'Hide' : 'Show' }} raw context (debug)</span>
      <div v-if="showDebug" class="debug-box">{{ debugText }}</div>
    </div>
  </div>

  <script>
    /* =========================================================================
     * Dunnes Stores (sandbox) -- Work Order Web Tab.
     * Shows the assigned Vendor's out-of-hours contact + notes fields.
     *
     * MANUAL CHECK -- none of the field/module names below have been verified
     * against Dunnes Stores' live schema (no MCP connector reaches that org
     * from this session; only KSD and Trinity Health are reachable). They are
     * taken directly from what was specified:
     *   - workOrder.vendor         -- standard CMMS lookup field name,
     *     consistent with core Facilio's workorder module everywhere else
     *     seen so far, but not independently confirmed for this org.
     *   - vendors.ooh_contact_vendors, vendors.ooh_notes_vendors -- as given.
     *
     * The bigger unknown: a Web Tab's getContext() returns a QUERY PARAMS
     * object (or {}), NOT the record directly (unlike Summary Tab / Custom
     * Button / Related List, which get the record itself). The exact key
     * holding the current Work Order's id isn't documented, so this widget
     * tries several plausible keys (see CONFIG.recordIdKeys) and shows the
     * raw context in an on-page debug panel if none of them resolve, so the
     * real key can be read straight off the widget and reported back.
     * ========================================================================= */
    var CONFIG = {
      workOrderModule: 'workorder',
      vendorModule: 'vendors',
      vendorLookupField: 'vendor',
      oohContactField: 'ooh_contact_vendors',
      oohNotesField: 'ooh_notes_vendors',
      // Tried in order against both the top-level context and context.query.
      recordIdKeys: ['id', 'recordId', 'workorderId', 'workOrderId', 'moduleRecordId']
    };

    var app = new Vue({
      el: '#app',
      data: {
        loading: true,
        fatalError: null,
        vendorId: null,
        vendor: null,
        oohContact: '',
        oohNotes: '',
        rawContext: null,
        showDebug: false
      },
      computed: {
        debugText: function () {
          try { return JSON.stringify(this.rawContext, null, 2); } catch (e) { return String(this.rawContext); }
        }
      },
      created: function () {
        var self = this;
        window.facilioApp = FacilioAppSDK.init();
        window.facilioApp.on('app.loaded', function () { self.init(); });
      },
      methods: {
        log: function (level, msg, err) {
          try { if (window.facilioApp && window.facilioApp.log && window.facilioApp.log[level]) window.facilioApp.log[level](msg, err); } catch (e) {}
          if (level === 'error') console.error(msg, err); else console.log(msg);
        },

        extractRecordId: function (ctx) {
          if (!ctx) return null;
          var sources = [ctx, ctx.query || {}];
          for (var s = 0; s < sources.length; s++) {
            for (var k = 0; k < CONFIG.recordIdKeys.length; k++) {
              var v = sources[s][CONFIG.recordIdKeys[k]];
              if (v != null && v !== '') return v;
            }
          }
          return null;
        },

        init: async function () {
          try {
            var ctx = window.facilioApp.getContext();
            this.rawContext = ctx;
            this.log('info', 'OOH_TAB context: ' + JSON.stringify(ctx));

            var workOrderId = this.extractRecordId(ctx);
            if (workOrderId == null) {
              this.fatalError = 'Could not determine the current Work Order from context. Expand "Show raw context" below and check which key actually holds the record id, then it can be added to CONFIG.recordIdKeys.';
              this.log('error', 'OOH_TAB no record id found in context', ctx);
              this.loading = false;
              this.showDebug = true;
              return;
            }

            var woResp = await window.facilioApp.api.fetchRecord(CONFIG.workOrderModule, { id: workOrderId });
            var wo = woResp && (woResp[CONFIG.workOrderModule] || woResp.record || woResp);
            this.log('info', 'OOH_TAB workorder fetched, vendor raw: ' + JSON.stringify(wo && wo[CONFIG.vendorLookupField]));

            var vendorRef = wo && wo[CONFIG.vendorLookupField];
            var vendorId = vendorRef && (vendorRef.id != null ? vendorRef.id : vendorRef);
            this.vendorId = vendorId || null;

            if (!this.vendorId) {
              this.loading = false;
              return;
            }

            var vResp = await window.facilioApp.api.fetchRecord(CONFIG.vendorModule, { id: this.vendorId });
            var vendor = vResp && (vResp[CONFIG.vendorModule] || vResp.record || vResp);
            this.vendor = vendor || null;
            this.oohContact = vendor ? (vendor[CONFIG.oohContactField] || '') : '';
            this.oohNotes = vendor ? (vendor[CONFIG.oohNotesField] || '') : '';
            this.log('info', 'OOH_TAB vendor loaded: ' + JSON.stringify({ id: this.vendorId, hasContact: !!this.oohContact, hasNotes: !!this.oohNotes }));
          } catch (e) {
            this.fatalError = 'Something went wrong loading vendor out-of-hours info. Check the debug panel and Connected App logs for details.';
            this.log('error', 'OOH_TAB init failed: ' + (e && e.message ? e.message : e), e);
            this.showDebug = true;
          } finally {
            this.loading = false;
          }
        }
      }
    });
  </script>
</body>
</html>
